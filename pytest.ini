# ==============================================================================
# Pytest Configuration for CMS POS/QIES Pipeline
# ==============================================================================

[pytest]

# ==============================================================================
# Test Discovery
# ==============================================================================
testpaths = tests
python_files = test_*.py

# ==============================================================================
# Import Path Configuration
# ==============================================================================
pythonpath = src

# ==============================================================================
# Runtime Options
# ==============================================================================
addopts =
    -q
    --disable-warnings
    --strict-markers
    --maxfail=1
    --durations=10

console_output_style = count

# ==============================================================================
# Logging
# ==============================================================================
log_cli = true
log_cli_level = INFO

# ==============================================================================
# Warning Filtering
# ==============================================================================
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# ==============================================================================
# Markers
# ==============================================================================
markers =
    stage01: Stage 01 schema tests
    stage02: Stage 02 ingestion tests
    stage03: Stage 03 quality tests
    stage04: Stage 04 reporting tests
    stage05: Stage 05 pipeline runner tests

    cpp_utils: Tests for C++ utility binaries (row counter, helpers)
    cpp_schema: Tests for C++ schema validator + Python integration
    cpp_all: Full C++ mechanization suite (utils + schema + integration)
