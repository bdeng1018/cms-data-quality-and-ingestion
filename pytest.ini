# ==============================================================================
# Pytest Configuration for CMS POS/QIES Pipeline
# ==============================================================================

[pytest]

# ==============================================================================
# Test Discovery
# ==============================================================================
testpaths = tests
python_files = test_*.py

# ==============================================================================
# Import Path Configuration
# ==============================================================================
pythonpath = src

# ==============================================================================
# Runtime Options
# ==============================================================================
addopts = -q -W default --disable-warnings --strict-markers
console_output_style = count

# ==============================================================================
# Logging
# ==============================================================================
log_cli = true
log_cli_level = INFO

# ==============================================================================
# Warning Filtering
# ==============================================================================
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# ==============================================================================
# Markers
# ==============================================================================
markers =
    stage01: Stage 01 schema tests
    stage02: Stage 02 ingestion tests
    stage03: Stage 03 quality tests
    stage04: Stage 04 reporting tests
    stage05: Stage 05 pipeline runner tests