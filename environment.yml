# ==============================================================================
# CMS POS/QIES Ingestion + Quality + Reporting Pipeline
# Deterministic conda environment for development, testing, and execution
# ==============================================================================

name: pos_qies_pipeline
channels:
  - conda-forge

dependencies:
  # ============================================================================
  # Core Python Runtime
  # ============================================================================
  - python=3.11

  # ============================================================================
  # Developer Tooling (formatting, linting, testing)
  # ============================================================================
  - black=24.*
  - isort=5.*
  - ruff=0.*
  - pytest=8.*

  # ============================================================================
  # Data Handling + File Formats
  # Stage 02 ingestion, Stage 03 profiling, Stage 04 reporting
  # ============================================================================
  - pandas=2.*
  - pyarrow=16.*
  - requests=2.*

  # ============================================================================
  # YAML + Configuration Parsing (Stage 05 runner)
  # ============================================================================
  - pyyaml=6.*

  # ============================================================================
  # Cryptographic + Hashing Utilities (Freeze Pipeline)
  # ============================================================================
  - openssl=3.*
  - pip

  # ============================================================================
  # Pip-only dependencies (freeze pipeline + validators)
  # ============================================================================
  - pip:
      - jsonschema==4.*
      - rich==13.*
