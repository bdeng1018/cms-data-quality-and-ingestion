# ==============================================================================
# CMS POS/QIES Ingestion + Quality + Reporting Pipeline
# Deterministic conda environment for development, testing, and execution
# ==============================================================================

name: pos_qies_pipeline
channels:
  - conda-forge

dependencies:
  # ============================================================================
  # Core Python Runtime
  # ============================================================================
  - python=3.11

  # ============================================================================
  # Developer Tooling (formatting, linting, testing)
  # ============================================================================
  - black=24.*
  - isort=5.*
  - ruff=0.*
  - pytest=8.*

  # ============================================================================
  # Data Handling + File Formats
  # ============================================================================
  - pandas=2.*
  - pyarrow=16.*
  - requests=2.*

  # ============================================================================
  # YAML + Configuration Parsing
  # ============================================================================
  - pyyaml=6.*

  # ============================================================================
  # Cryptographic + Hashing Utilities (Freeze Pipeline)
  # ============================================================================
  - openssl=3.*
  - pip

  # ============================================================================
  # C++ Mechanization (NEW)
  # ============================================================================
  - gxx_linux-64=13.* # deterministic C++ compiler
  - cmake=3.* # optional, future-proofing
  - ninja=1.* # optional, fast builds

  # ============================================================================
  # Pip-only dependencies
  # ============================================================================
  - pip:
      - jsonschema==4.*
      - rich==13.*
