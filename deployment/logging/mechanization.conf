# ==============================================================================
# CMS Pipeline — Mechanization Logging (C++ Schema + Row Counter)
# ==============================================================================
# Intent:
#   Provide a dedicated Fluent Bit pipeline for deterministic mechanization logs.
#   This isolates C++ subprocess output from general pipeline logs and prepares
#   the system for future cloud sinks (CloudWatch, Stackdriver, Loki).
#
# Determinism Guarantees:
#   - stable log parsing rules
#   - stable timestamp formatting
#   - stable routing behavior
#   - reproducible enrichment fields
#   - mechanization-specific provenance
#
# Side Effects:
#   - forwards mechanization logs to stdout or file
#   - enriches logs with mechanization metadata
#   - keeps mechanization logs separate from pipeline logs
# ==============================================================================

[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

# ==============================================================================
# Input: Mechanization Logs
# ==============================================================================
# Intent:
#   Capture deterministic C++ mechanization logs:
#     - schema validator (Stage 01)
#     - row counter (Stage 02)
#
# Determinism:
#   - stable path (/app/logs/mechanization.log)
#   - stable format (plain text)
# ==============================================================================
[INPUT]
    Name        tail
    Path        /app/logs/mechanization.log
    Tag         cms.mechanization
    Parser      none
    DB          /app/logs/fluent-bit-mech.db

# ==============================================================================
# Filter: Mechanization Provenance
# ==============================================================================
# Intent:
#   Add deterministic mechanization metadata for observability and reproducibility.
#
# Determinism:
#   - stable enrichment keys
#   - stable values
# ==============================================================================
[FILTER]
    Name        record_modifier
    Match       cms.mechanization
    Record      provenance environment docker
    Record      provenance executor fluent-bit
    Record      pipeline version 1.1.0
    Record      mechanization mode python+cpp
    Record      mechanization cpp_compiler_version g++-13

# ==============================================================================
# Output: Stdout (Local + Compose)
# ==============================================================================
# Intent:
#   Provide deterministic local output for debugging mechanization behavior.
#
# Future Extension:
#   - replace with cloud log sink (CloudWatch, Stackdriver, Loki)
# ==============================================================================
[OUTPUT]
    Name        stdout
    Match       cms.mechanization
