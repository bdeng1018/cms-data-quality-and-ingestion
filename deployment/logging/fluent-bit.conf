# ==============================================================================
# CMS Data Quality & Ingestion Pipeline (Fluent Bit Config)
# ==============================================================================
# Intent:
#   Provide deterministic log forwarding, enrichment, and routing for the CMS
#   ingestion pipeline. Fluent Bit ensures reproducible log formats and stable
#   ingestion behavior across local, docker-compose, Kubernetes, and cloud
#   deployments.
#
# Determinism Guarantees:
#   - stable log parsing rules
#   - stable timestamp formatting
#   - stable routing behavior
#   - reproducible enrichment fields
#   - deterministic mechanization logging (v1.1.0)
#
# Side Effects:
#   - forwards logs to stdout, file, or cloud storage
#   - enriches logs with provenance metadata
#   - captures mechanization subprocess output
#
# Future Extensions:
#   - add cloud log sinks (CloudWatch, Stackdriver, Loki)
#   - add ingestion latency metrics
#   - add structured JSON logs
# ==============================================================================

[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

# ==============================================================================
# Input: Pipeline Logs
# ==============================================================================
# Intent:
#   Read logs from the deterministic pipeline log directory (/app/logs).
#
# Determinism:
#   - stable path
#   - stable format
# ==============================================================================
[INPUT]
    Name        tail
    Path        /app/logs/*.log
    Tag         cms.pipeline
    Parser      json
    DB          /app/logs/fluent-bit.db

# ==============================================================================
# Input: Mechanization Logs (C++ Subprocess)
# ==============================================================================
# Intent:
#   Capture deterministic C++ mechanization logs (schema validator, row counter).
#
# Determinism:
#   - stable path (/app/logs/mechanization.log)
#   - stable format (plain text)
# ==============================================================================
[INPUT]
    Name        tail
    Path        /app/logs/mechanization.log
    Tag         cms.mechanization
    Parser      none
    DB          /app/logs/fluent-bit-mech.db

# ==============================================================================
# Filter: Add Provenance Metadata
# ==============================================================================
# Intent:
#   Enrich logs with deterministic provenance fields for observability and
#   reproducibility.
#
# Determinism:
#   - stable enrichment keys
#   - stable values
# ==============================================================================
[FILTER]
    Name        record_modifier
    Match       cms.pipeline
    Record      provenance environment docker
    Record      provenance executor fluent-bit
    Record      pipeline version 1.1.0
    Record      mechanization mode python+cpp

[FILTER]
    Name        record_modifier
    Match       cms.mechanization
    Record      provenance environment docker
    Record      provenance executor fluent-bit
    Record      pipeline version 1.1.0
    Record      mechanization mode python+cpp
    Record      mechanization cpp_compiler_version g++-13

# ==============================================================================
# Output: Stdout (Local + Compose)
# ==============================================================================
# Intent:
#   Provide deterministic local log output for debugging and development.
#
# Future Extension:
#   - replace with cloud log sink
# ==============================================================================
[OUTPUT]
    Name        stdout
    Match       cms.pipeline

[OUTPUT]
    Name        stdout
    Match       cms.mechanization
