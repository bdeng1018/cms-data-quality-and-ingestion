# ==============================================================================
# CMS Data Quality & Ingestion Pipeline (Helm Chart Definition)
# ==============================================================================
# Intent:
#   Define a deterministic Helm chart for packaging and deploying the CMS ingestion
#   pipeline onto Kubernetes. This chart mirrors docker-compose reproducibility
#   guarantees while enabling versioned, parameterized, and environment-specific
#   deployments.
#
# Determinism Guarantees:
#   - Chart version pinned.
#   - App version pinned.
#   - Stable metadata for provenance tracking.
#
# Future Extensions:
#   - Add Helm hooks for pre-ingestion validation.
#   - Add templates for distributed ingestion.
#   - Add cloud storage PVC templates.
# ==============================================================================

apiVersion: v2
name: cms-pipeline
description: CMS Data Quality & Ingestion Pipeline — Deterministic Helm Deployment
type: application

version: 0.1.0 # Helm chart version
appVersion: "0.1.0" # Pipeline version (semantic)
