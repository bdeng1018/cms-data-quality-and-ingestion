# ==============================================================================
# CMS Data Quality & Ingestion Pipeline (K8s Deployment Manifest)
# ==============================================================================
# Intent:
#   Define a deterministic Kubernetes Deployment for the CMS ingestion pipeline.
#   This manifest mirrors docker-compose reproducibility guarantees while adding
#   orchestration-level stability, provenance annotations, and resource isolation.
#
# Determinism Guarantees:
#   - Pinned container image.
#   - Stable environment variables.
#   - Read-only mounts for code/configs.
#   - Writable mounts only for artifacts/logs.
#   - Resource limits ensure reproducible runtime characteristics.
#
# Side Effects:
#   - Writes artifacts to /app/data.
#   - Writes logs to /app/logs.
#   - Produces manifest + artifact registry in Stage 05.
#
# Future Extensions:
#   - Add liveness/readiness probes.
#   - Add autoscaling rules.
#   - Add cloud storage PVCs.
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-pipeline
  labels:
    app: cms-pipeline
    pipeline: ingestion
    provenance: "k8s"

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cms-pipeline

  template:
    metadata:
      labels:
        app: cms-pipeline
      annotations:
        provenance/environment: "k8s"
        provenance/executor: "k8s-deployment"

    spec:
      containers:
        - name: cms-pipeline
          image: cms_ingestion:latest

          # ====================================================================
          # Environment Variables
          # ====================================================================
          # Intent:
          #   Provide deterministic runtime configuration and provenance fields.
          #
          # Determinism:
          #   - Matches docker-compose + CI/CD environment.
          # ====================================================================
          env:
            - name: CMS_ENV
              value: "k8s"
            - name: CMS_CONFIG_PATH
              value: "/app/configs/pipeline.yml"
            - name: CMS_LOG_LEVEL
              value: "INFO"
            - name: CMS_PROVENANCE_TAG
              value: "k8s-deployment"

          # ====================================================================
          # Volume Mounts (Isolation Contract)
          # ====================================================================
          # Intent:
          #   Enforce strict isolation between pipeline code (read-only) and artifacts/logs
          #   (read-write). Mirrors docker-compose reproducibility guarantees.
          #
          # Determinism:
          #   - Code/configs/scripts/deployment mounted read-only → no mutation.
          #   - Data/logs mounted read-write → artifact isolation.
          # ====================================================================
          volumeMounts:
            - name: configs
              mountPath: /app/configs
              readOnly: true
            - name: src
              mountPath: /app/src
              readOnly: true
            - name: utils
              mountPath: /app/utils
              readOnly: true
            - name: scripts
              mountPath: /app/scripts
              readOnly: true
            - name: deployment
              mountPath: /app/deployment
              readOnly: true

            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs

          # ====================================================================
          # Resource Limits
          # ====================================================================
          # Intent:
          #   Provide reproducible performance characteristics and prevent nondeterministic
          #   behavior due to node-level resource variability.
          #
          # Determinism:
          #   - CPU + memory limits stabilize runtime duration and ordering.
          # ====================================================================
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"

          # ====================================================================
          # Entrypoint
          # ====================================================================
          # Intent:
          #   Provide deterministic pipeline execution via Stage 05 runner.
          #
          # Future Extension:
          #   Replace with `cms run` after CLI implementation.
          # ====================================================================
          command: ["python", "-m", "src.stage05_pipeline_runner.run_pipeline"]

      # ========================================================================
      # Volumes
      # ========================================================================
      # Intent:
      #   Define PVC-backed volumes for artifacts/logs and ConfigMap-backed volumes for
      #   code/configs. This ensures deterministic isolation and reproducibility.
      #
      # Future Extension:
      #   - Replace hostPath with PVCs for cloud storage.
      # ========================================================================
      volumes:
        - name: configs
          hostPath:
            path: ../configs
        - name: src
          hostPath:
            path: ../src
        - name: utils
          hostPath:
            path: ../utils
        - name: scripts
          hostPath:
            path: ../scripts
        - name: deployment
          hostPath:
            path: ../deployment

        - name: data
          hostPath:
            path: ../data
        - name: logs
          hostPath:
            path: ../logs
