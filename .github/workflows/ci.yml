name: CMS Pipeline CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. Build, Test, Lint, Docker Build & Push, Metadata Upload
  # ============================================================================
  build-test-validate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r deployment/requirements.txt
          pip install pytest flake8

      - name: Add project root to PYTHONPATH
        run: |
          echo "PYTHONPATH=$(pwd):$(pwd)/src:$(pwd)/scripts" >> $GITHUB_ENV

      - name: Run tests
        run: PYTHONPATH=$(pwd):$(pwd)/src:$(pwd)/scripts pytest -q

      - name: Lint code (non-blocking)
        run: |
          set +e
          PYTHONPATH=$(pwd):$(pwd)/src:$(pwd)/scripts flake8 src/
          echo "Ignoring flake8 failures"
          exit 0

      # Enable Docker Buildx (required for modern GHCR pushes)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR using your PAT
      - name: Log in to GHCR
        if: always()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: bdeng1018
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker image
        if: always()
        run: docker build -t cms-pipeline:1.0.0 -f deployment/Dockerfile .

      - name: Tag Docker image for GHCR
        if: always()
        run: docker tag cms-pipeline:1.0.0 ghcr.io/bdeng1018/cms-pipeline:1.0.0

      - name: Push Docker image to GHCR
        if: always()
        run: docker push ghcr.io/bdeng1018/cms-pipeline:1.0.0

      - name: Compute GHCR digest
        if: always()
        id: digest
        run: |
          DIGEST=$(docker inspect ghcr.io/bdeng1018/cms-pipeline:1.0.0 --format='{{index .RepoDigests 0}}')
          echo "$DIGEST" > docker-image-digest.txt
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Upload Docker digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-digest
          path: docker-image-digest.txt

      - name: Print CI/CD metadata
        run: |
          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "COMMIT_SHA=$GITHUB_SHA"

      - name: Upload metadata artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cicd-metadata
          path: |
            deployment/releases/v1.0.0.manifest.json
            deployment/sbom/sbom-1.0.0.json

  # ============================================================================
  # 2. Drift Detection — Enforce Deterministic Pipeline
  # ============================================================================
  drift-check:
    runs-on: ubuntu-22.04
    needs: build-test-validate # ensures build completes first

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r deployment/requirements.txt

      - name: Validate manifest
        run: python deployment/scripts/validate_manifest.py

      - name: Validate SBOM
        run: python deployment/scripts/validate_sbom.py

      - name: Validate provenance
        run: python deployment/scripts/validate_provenance.py
