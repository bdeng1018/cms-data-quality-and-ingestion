name: CMS Pipeline CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. Build, Test, Lint, Docker Build & Push, Metadata Upload
  # ============================================================================
  build-test-validate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r deployment/requirements.txt
          pip install pytest flake8

      - name: Add project root to PYTHONPATH
        run: |
          echo "PYTHONPATH=$(pwd):$(pwd)/src:$(pwd)/scripts" >> $GITHUB_ENV

      - name: Run tests
        run: PYTHONPATH=$(pwd):$(pwd)/src:$(pwd)/scripts pytest -q

      - name: Lint code (non-blocking)
        run: |
          set +e
          PYTHONPATH=$(pwd):$(pwd)/src:$(pwd)/scripts flake8 src/
          echo "Ignoring flake8 failures"
          exit 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: always()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: bdeng1018
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker image
        if: always()
        run: docker build -t cms-pipeline:1.0.1 -f deployment/Dockerfile .

      - name: Tag Docker image for GHCR
        if: always()
        run: docker tag cms-pipeline:1.0.1 ghcr.io/bdeng1018/cms-pipeline:1.0.1

      - name: Push Docker image to GHCR
        if: always()
        run: docker push ghcr.io/bdeng1018/cms-pipeline:1.0.1

      - name: Compute GHCR digest
        if: always()
        id: digest
        run: |
          DIGEST=$(docker inspect ghcr.io/bdeng1018/cms-pipeline:1.0.1 --format='{{index .RepoDigests 0}}' | cut -d'@' -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Write docker digest file for bump_version.py
        if: always()
        run: |
          mkdir -p deployment
          echo "${{ steps.digest.outputs.digest }}" > deployment/docker-digest.txt

      - name: Upload Docker digest (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-digest
          path: deployment/docker-digest.txt

      - name: Print CI/CD metadata
        run: |
          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "COMMIT_SHA=$GITHUB_SHA"

      - name: Upload metadata artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cicd-metadata
          path: |

  # ============================================================================
  # 2. Drift Detection — Enforce Deterministic Pipeline
  # ============================================================================
  drift-check:
    runs-on: ubuntu-22.04
    needs: freeze-release

    steps:
      - name: Download frozen artifacts
        uses: actions/download-artifact@v4
        with:
          name: frozen-release-1.0.1
          path: deployment/

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r deployment/requirements.txt

      - name: Validate manifest
        run: python deployment/scripts/validate_manifest.py 1.0.1

      - name: Validate SBOM
        run: python deployment/scripts/validate_sbom.py 1.0.1

      - name: Validate provenance
        run: python deployment/scripts/validate_provenance.py 1.0.1

  # ============================================================================
  # 3. Freeze Job — Run bump_version.py + Validate Release
  # ============================================================================
  freeze-release:
    runs-on: ubuntu-22.04
    needs: build-test-validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download docker digest from build job
        uses: actions/download-artifact@v4
        with:
          name: docker-image-digest
          path: deployment/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r deployment/requirements.txt

      - name: Run version bump script
        run: |
          python deployment/scripts/bump_version.py 1.0.1

      - name: Validate manifest
        run: python deployment/scripts/validate_manifest.py 1.0.1

      - name: Validate SBOM
        run: python deployment/scripts/validate_sbom.py 1.0.1

      - name: Validate provenance
        run: python deployment/scripts/validate_provenance.py 1.0.1

      - name: Upload frozen release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frozen-release-1.0.1
          path: |
            deployment/releases/1.0.1.manifest.json
            deployment/sbom/sbom-1.0.1.json
            deployment/provenance/provenance-1.0.1.json
            deployment/docker-digest.txt

  # ============================================================================
  # 4. Bundle Builder — Create Release Bundle (tar.gz)
  # ============================================================================
  bundle-release:
    runs-on: ubuntu-22.04
    needs: freeze-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frozen release artifacts
        uses: actions/download-artifact@v4
        with:
          name: frozen-release-1.0.1
          path: deployment/bundles/1.0.1/

      - name: Create release bundle
        run: |
          cd deployment/bundles/1.0.1
          tar -czf cms-pipeline-1.0.1.tar.gz \
            1.0.1.manifest.json \
            sbom-1.0.1.json \
            provenance-1.0.1.json \
            docker-digest.txt

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: cms-pipeline-1.0.1-bundle
          path: deployment/bundles/1.0.1/cms-pipeline-1.0.1.tar.gz
