name: CMS Pipeline CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-test-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r deployment/requirements.txt
          pip install pytest flake8

      - name: Add project root to PYTHONPATH
        run: |
          echo "PYTHONPATH=$(pwd):$(pwd)/src:$(pwd)/scripts" >> $GITHUB_ENV

      - name: Run tests
        run: PYTHONPATH=$(pwd):$(pwd)/src:$(pwd)/scripts pytest -q

      - name: Lint code
        run: PYTHONPATH=$(pwd):$(pwd)/src:$(pwd)/scripts flake8 src/ || true

      - name: Build Docker image
        run: docker build -t cms-pipeline:1.0.0 -f deployment/Dockerfile .

      - name: Compute Docker digest
        id: digest
        run: |
          DIGEST=$(docker inspect cms-pipeline:1.0.0 --format='{{.Id}}')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Upload Docker digest
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-digest
          path: ${{ steps.digest.outputs.digest }}

      - name: Print CI/CD metadata
        run: |
          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "COMMIT_SHA=$GITHUB_SHA"

      - name: Upload metadata artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cicd-metadata
          path: |
            deployment/releases/v1.0.0.manifest.json
            deployment/sbom/sbom-1.0.0.json
